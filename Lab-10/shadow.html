<!doctype html>
<html>
  <head>
    <title>CSS Box Shadow and Text Shadow</title>

    <style>
      .box {
        width: 500px;
        height: 300px;
        background-color: rgb(246, 194, 243);
        box-shadow: 15px 15px 20px rgb(45, 238, 222);
        padding: 20px;
        margin: 40px;
        text-align: center;
      }
      h2 {
        text-shadow: 2px 2px 15px rgb(238, 74, 46);
      }
    </style>
  </head>
  <body>
      <div class="box">
          <p>Hello i am Akshat Kumar.
        </p>
    </div>
    <h2>Text Shadow</h2>
  </body>
</html>
