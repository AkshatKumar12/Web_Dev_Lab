<!DOCTYPE html>
<html>
<head>
    <title>Hyperlink Styling using CSS</title>

    <style>
        /* Default link */
        a:link {
            color: pink;
            text-decoration: none;
        }

        /* Visited link */
        a:visited {
            color: green;
            text-decoration: none;
        }

        /* Active link */
        a:active {
            color: blue;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>CSS Hyperlink Example</h2>

<p><a href="https://www.google.com">Google</a></p>
<p><a href="https://www.wikipedia.org">Wikipedia</a></p>
<p><a href="https://www.github.com">GitHub</a></p>

</body>
</html>
