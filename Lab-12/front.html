<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>CARD Validator</h2>
    <label for="card">Enter card number.</label><br />
    <input type="text" id="cardInput" />
    <button onclick="checkCard()">Validate</button>


    <script>
      function checkCard() {
        var num = document.getElementById("cardInput").value;
        var len = num.length;

        if (
          (num.startsWith(51)   ||
            num.startsWith(52)  ||
            num.startsWith(53)  ||
            num.startsWith(54)  ||
            num.startsWith(55)) &&
          len == 16
        ) {
          alert("Master Card");
        } else if (num.startsWith(4) && (len == 16 || len == 13)) {
          alert("VISA");
        } else if ((num.startsWith(34) || num.startsWith(37)) && len == 15) {
          alert("American Express");
        } else {
          alert("Invalid card");
        }
      }
    </script>

    
  </body>
</html>
