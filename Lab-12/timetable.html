<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTable</title>

    <style>
        th{
            border: 2px solid black;
        }
        tr{
            border: 2px solid black;
        }
        td{
            border: 2px solid black;
        }
        table{
            border-collapse: collapse;
        }
        td{
            padding: 5px;
        }
        th{
            padding: 5px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>8-9</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
            <th>Break</th>
            <th>12-1</th>
            <th>1-2</th>
            <th>2-3</th>
        </tr>
    </table>
</body>
</html>
