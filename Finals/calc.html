<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<body>
    <h1>Thanks for using our calculator.</h1>

    <label for="calculator">CALCULATOR</label><br>

    <input type="text" id="op1" placeholder="Enter first number"><br>
    <input type="text" id="operator" placeholder="Enter operator (+,-,*,/)"><br>
    <input type="text" id="op2" placeholder="Enter second number"><br>

    <button onclick="Solve()">Find result</button>

    <script>
        function Solve() {
            let op1 = parseFloat(document.getElementById("op1").value);
            let op2 = parseFloat(document.getElementById("op2").value);
            let operator = document.getElementById("operator").value;

            let result;

            if (operator === '+') {
                result = op1 + op2;
            } 
            else if (operator === '-') {
                result = op1 - op2;
            } 
            else if (operator === '*') {
                result = op1 * op2;
            } 
            else if (operator === '/') {
                result = op1 / op2;
            } 
            else {
                alert("Invalid operation");
                return;
            }

            alert("Result: " + result);
        }
    </script>
</body>
</html>
